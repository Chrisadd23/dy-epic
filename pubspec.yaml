name: app_flutter_produkt_bestellen
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  path: any
  get_it: ^7.6.0
  bloc: ^9.0.0
  equatable: ^2.0.5
  flutter_bloc: ^9.0.0
  flutter_spinkit: ^5.2.0
  go_router: ^7.1.1
  icon_decoration: ^2.0.0
  either_dart: ^0.4.0
  freezed_annotation: ^2.4.1
  flutter_hooks: ^0.20.1
  image: ^4.1.0
  flutter_svg: ^2.0.9
  intl: ^0.19.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  swipeable_tile: ^2.0.0+3
  dropdown_button2: ^2.3.9
  json_annotation: ^4.9.0
  flutter_local_notifications: ^17.1.2
  permission_handler: ^11.3.1
  google_fonts: ^6.2.0
  flutter_inset_shadow: ^2.0.3
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.12
  flutter_gen_runner: ^5.9.0
  freezed: ^2.4.2
  json_serializable: ^6.8.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.3
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "dy_epic"
  ios: true
  image_path: assets/company/epic_logo_scaled.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/appComponents/
    - assets/appComponents/failure/
    - assets/appComponents/svg/
    - assets/appComponents/jpg/
    - assets/company/
