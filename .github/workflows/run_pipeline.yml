name: "build release on pull request"

on:
  pull_request:
    branches:
      - main
      - master
      - develop
    types: [ opened, synchronize, reopened ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
      - name: Import Keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > /tmp/keystore.jks
          echo "flutter.buildModes.release.signingConfigs.release.keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "flutter.buildModes.release.signingConfigs.release.storeFile=/tmp/keystore.jks" >> android/key.properties
          echo "flutter.buildModes.release.signingConfigs.release.storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
          echo "flutter.buildModes.release.signingConfigs.release.keyPassword=$KEY_PASSWORD" >> android/key.properties
      - run: rm -f pubspec.lock
      - run: flutter clean
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --split-per-abi
      - name: Push to Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/apk/release/*"
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.GITHUB_TOKEN }}
