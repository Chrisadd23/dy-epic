name: "build release on pull request"

on:
  pull_request:
    branches:
      - master
      - main
      - develop
    types: [ opened, synchronize, reopened ]

jobs:
  flutter_test:
    name: Run flutter test and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: "17.x"
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          channel: "13.6.9"
      - name: Import Keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > /tmp/keystore.jks
          echo "flutter.buildModes.release.signingConfigs.release.keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "flutter.buildModes.release.signingConfigs.release.storeFile=/tmp/keystore.jks" >> android/key.properties
          echo "flutter.buildModes.release.signingConfigs.release.storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
          echo "flutter.buildModes.release.signingConfigs.release.keyPassword=$KEY_PASSWORD" >> android/key.properties
      - run: rm -f pubspec.lock
      - run: flutter clean
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build_ios:
    name: Build Flutter (iOS)
    needs: [ flutter_test ]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: "17.x"
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          channel: "13.6.9"
      - run: flutter pub get
      - run: flutter clean
      - run: flutter build ios --release --no-codesign

  build_appbundle:
    name: Build Flutter (Android)
    needs: [ flutter_test ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: "17.x"
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          channel: "13.6.9"
      - run: flutter pub get
      - run: flutter clean
      - run: flutter build appbundle

